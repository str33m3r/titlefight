<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Title Fight</title>
  <style>
    :root {
      --green: #3dcc6a;
      --blue: #3d9eff;
      --center: #f3e2bf;
      --cell: 24px;
      --gap: 4px;
      --app-h: 100svh;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: var(--app-h);
      background: #050505;
      color: #f5f5f5;
      font-family: "Arial Narrow", "Oswald", "Impact", sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      overflow: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      height: var(--app-h);
      padding:
        max(2px, env(safe-area-inset-top))
        max(2px, env(safe-area-inset-right))
        max(2px, env(safe-area-inset-bottom))
        max(2px, env(safe-area-inset-left));
    }

    .table {
      width: min(430px, 100%);
      height: 100%;
      background: #000;
      border: 2px solid #1a1a1a;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      padding: 6px;
      flex-shrink: 0;
      z-index: 4;
    }
    .hud.red { background: linear-gradient(#081408, #000); transform: rotate(180deg); }
    .hud.blue { background: linear-gradient(#000, #081018); }

    .stat { display: flex; }

    .stat-label {
      min-width: 5.6em;
      padding: 6px 8px;
      font-size: clamp(14px, 4.6vw, 20px);
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .hud.red .stat-label { background: var(--green); color: #062410; }
    .hud.blue .stat-label { background: var(--blue); color: #001428; }

    .stat-btns { display: flex; flex-direction: column; }
    .stat-btns button {
      width: 36px;
      min-height: 28px;
      border: none;
      font-size: 17px;
      font-weight: 800;
      -webkit-tap-highlight-color: transparent;
    }
    .hud.red .stat-btns button:first-child { background: #b7f0c8; color: #0a3a18; }
    .hud.red .stat-btns button:last-child { background: #d6f7e0; color: #0a3a18; }
    .hud.blue .stat-btns button:first-child { background: #b7dbff; color: #0a2a4a; }
    .hud.blue .stat-btns button:last-child { background: #d6ebff; color: #0a2a4a; }
    .stat-btns button:active { filter: brightness(.92); }

    .board-wrap {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: radial-gradient(ellipse at center, #1a1208 0%, #070707 70%);
    }

    .board-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 4px 8px 2px;
      flex-shrink: 0;
    }
    .title-badge { font-size: 11px; letter-spacing: 2px; color: #8a8a8a; font-weight: 700; }
    .status {
      flex: 1;
      text-align: center;
      font-size: 10px;
      letter-spacing: .5px;
      color: #8a8a8a;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-height: 12px;
    }
    .reset-btn {
      background: #ffe566;
      color: #1a1400;
      border: 1px solid #c9b034;
      padding: 6px 10px;
      font-size: 11px;
      letter-spacing: 1px;
      font-family: inherit;
      font-weight: 700;
      -webkit-tap-highlight-color: transparent;
    }

    .arena {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2px 8px 8px;
      overflow: hidden;
    }

    .arena-frame {
      position: relative;
      max-width: 100%;
      max-height: 100%;
    }

    .post {
      position: absolute;
      width: 10px;
      height: 10px;
      background: linear-gradient(145deg, #f2d36b, #8a6a18);
      border: 1px solid #5a4308;
      z-index: 3;
    }
    .post.tl { top: -1px; left: -1px; }
    .post.tr { top: -1px; right: -1px; }
    .post.bl { bottom: -1px; left: -1px; }
    .post.br { bottom: -1px; right: -1px; }

    .arena-canvas {
      background: repeating-linear-gradient(90deg, #c4a36a 0 2px, #b89558 2px 8px);
      box-shadow:
        inset 0 0 0 3px #e8e8e8,
        inset 0 0 0 6px #d42a2a,
        inset 0 0 0 9px #2a7ad4,
        0 0 0 4px #1a120c,
        0 0 0 6px #6a4a28;
      padding: 10px;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(7, var(--cell));
      grid-template-rows: repeat(13, var(--cell));
      gap: var(--gap);
    }

    .cell {
      position: relative;
      width: var(--cell);
      height: var(--cell);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: calc(var(--cell) * .5);
      font-weight: 800;
      border-radius: 2px;
    }
    .cell.red { background: var(--green); color: #062410; }
    .cell.blue { background: var(--blue); color: #00132a; }
    .cell.center { background: var(--center); color: #5a4a28; font-size: calc(var(--cell) * .28); }
    .cell.occupied {
      outline: 2px solid #ffe566;
      outline-offset: 1px;
      box-shadow: 0 0 8px 1px rgba(255,229,102,.4);
    }

    .token {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: calc(var(--cell) * .78);
      line-height: 1;
      pointer-events: none;
      filter: drop-shadow(0 2px 2px rgba(0,0,0,.7));
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,.72);
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      z-index: 10;
      text-align: center;
      padding: 20px;
    }
    .overlay.show { display: flex; }
    .overlay h2 { font-size: clamp(26px, 8vw, 34px); letter-spacing: 2px; }
    .overlay p { color: #ccc; font-size: 14px; }
    .overlay button {
      padding: 12px 18px;
      font-family: inherit;
      font-weight: 800;
      letter-spacing: 1px;
      border: none;
      background: #fff;
    }
  </style>

<body>
  <div class="table">
    <div class="hud red" data-who="red"></div>
    <div class="board-wrap">
      <div class="board-bar">
        <div class="title-badge">TITLE FIGHT</div>
        <div class="status" id="status"></div>
        <button class="reset-btn" id="reset" type="button">RESET</button>
      </div>
      <div class="arena" id="arena">
        <div class="arena-frame">
          <div class="post tl"></div><div class="post tr"></div>
          <div class="post bl"></div><div class="post br"></div>
          <div class="arena-canvas">
            <div class="board" id="board"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="hud blue" data-who="blue"></div>
    <div class="overlay" id="overlay">
      <h2 id="winner-title">KO</h2>
      <p id="winner-msg"></p>
      <button type="button" id="play-again">RESET FIGHT</button>
    </div>
  </div>

  <script>
    const PATH = [
      ["r10","red","10",6,1], ["r9","red","9",5,2], ["r8","red","8",4,1],
      ["r7","red","7",3,2], ["r6","red","6",2,1], ["r5","red","5",1,2],
      ["r4","red","4",1,3], ["r3","red","3",1,4], ["r2","red","2",2,5],
      ["r1","red","1",3,6], ["center","center","",4,7],
      ["b1","blue","1",5,8], ["b2","blue","2",6,9], ["b3","blue","3",7,10],
      ["b4","blue","4",7,11], ["b5","blue","5",7,12], ["b6","blue","6",6,13],
      ["b7","blue","7",5,12], ["b8","blue","8",4,13], ["b9","blue","9",3,12],
      ["b10","blue","10",2,13]
    ].map(([id, side, label, c, r]) => ({ id, side, label, c, r }));

    const CENTER = 10;
    const NAME = { red: "P2", blue: "P1" };
    const RP_DIR = { red: [1, -1], blue: [-1, 1] };
    const START_HP = 30;

    const state = { red: { hp: START_HP }, blue: { hp: START_HP }, pos: CENTER, over: false };
    const cells = {};
    const labels = {};
    let token, lastCell;

    const boardEl = document.getElementById("board");
    const statusEl = document.getElementById("status");
    const overlayEl = document.getElementById("overlay");
    const arenaEl = document.getElementById("arena");
    const root = document.documentElement;

    function el(tag, cls, text) {
      const n = document.createElement(tag);
      if (cls) n.className = cls;
      if (text != null) n.textContent = text;
      return n;
    }

    function buildHud(rootHud) {
      const who = rootHud.dataset.who;
      const dir = RP_DIR[who];
      rootHud.innerHTML =
        '<div class="stat"><div class="stat-label" data-hp></div><div class="stat-btns">' +
        '<button type="button" data-act="hp" data-who="' + who + '" data-delta="1">+</button>' +
        '<button type="button" data-act="hp" data-who="' + who + '" data-delta="-1">−</button></div></div>' +
        '<div class="stat"><div class="stat-label" data-rp></div><div class="stat-btns">' +
        '<button type="button" data-act="rp" data-who="' + who + '" data-dir="' + dir[0] + '">+</button>' +
        '<button type="button" data-act="rp" data-who="' + who + '" data-dir="' + dir[1] + '">−</button></div></div>';
      labels[who] = { hp: rootHud.querySelector("[data-hp]"), rp: rootHud.querySelector("[data-rp]") };
    }

    function buildBoard() {
      const frag = document.createDocumentFragment();
      PATH.forEach((sq) => {
        const n = el("div", "cell " + sq.side, sq.label);
        n.style.gridColumn = sq.c;
        n.style.gridRow = sq.r;
        cells[sq.id] = n;
        frag.appendChild(n);
      });
      boardEl.appendChild(frag);
      token = el("div", "token", "🥊");
    }

    function posName(i) {
      const sq = PATH[i];
      return sq.id === "center" ? "CENTER" : (sq.side === "red" ? "G" : "B") + sq.label;
    }

    function render() {
      if (lastCell) lastCell.classList.remove("occupied");
      const cell = cells[PATH[state.pos].id];
      cell.appendChild(token);
      cell.classList.add("occupied");
      lastCell = cell;
      const rp = posName(state.pos);
      labels.red.hp.textContent = "HP " + state.red.hp;
      labels.blue.hp.textContent = "HP " + state.blue.hp;
      labels.red.rp.textContent = "RP " + rp;
      labels.blue.rp.textContent = "RP " + rp;
    }

    function setStatus(msg) { statusEl.textContent = msg || ""; }

    function tryMove(who, dir) {
      if (state.over) return;
      const to = state.pos + dir;
      if (to < 0 || to >= PATH.length) return setStatus("End of the ring");
      state.pos = to;
      const sq = PATH[to];
      setStatus(NAME[who] + " → " + posName(to) + (sq.side === "center" ? "" : sq.side === "red" ? " · green" : " · blue"));
      render();
    }

    function changeHp(who, delta) {
      if (state.over && delta < 0) return;
      state[who].hp = Math.max(0, Math.min(99, state[who].hp + delta));
      if (state[who].hp === 0) {
        state.over = true;
        const winner = who === "red" ? "P1 BLUE" : "P2 GREEN";
        document.getElementById("winner-title").textContent = "K.O.";
        document.getElementById("winner-msg").textContent = winner + " WINS";
        overlayEl.classList.add("show");
        setStatus(winner + " wins");
      }
      render();
    }

    function reset() {
      state.red.hp = START_HP;
      state.blue.hp = START_HP;
      state.pos = CENTER;
      state.over = false;
      overlayEl.classList.remove("show");
      setStatus("");
      render();
    }

    function setAppHeight() {
      const vv = window.visualViewport;
      const h = vv ? vv.height : window.innerHeight;
      root.style.setProperty("--app-h", Math.floor(h) + "px");
    }

    function fitBoard() {
      const w = arenaEl.clientWidth;
      const h = arenaEl.clientHeight;
      if (w < 80 || h < 80) return;
      const chrome = 36;
      const cell = Math.max(13, Math.min(36, (w - chrome) / 7.9, (h - chrome) / 15.1));
      root.style.setProperty("--cell", cell.toFixed(2) + "px");
      root.style.setProperty("--gap", Math.max(2, cell * 0.13).toFixed(2) + "px");
    }

    function layout() {
      setAppHeight();
      requestAnimationFrame(fitBoard);
    }

    document.querySelector(".table").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-act]");
      if (!btn) return;
      if (btn.dataset.act === "hp") changeHp(btn.dataset.who, +btn.dataset.delta);
      else tryMove(btn.dataset.who, +btn.dataset.dir);
    });
    document.getElementById("reset").onclick = reset;
    document.getElementById("play-again").onclick = reset;

    document.querySelectorAll(".hud").forEach(buildHud);
    buildBoard();
    render();
    layout();
    window.addEventListener("resize", layout);
    if (window.visualViewport) window.visualViewport.addEventListener("resize", layout);
    window.addEventListener("orientationchange", () => setTimeout(layout, 250));
    if (window.ResizeObserver) new ResizeObserver(fitBoard).observe(arenaEl);
  </script>
</body>
</html>
